name: Lint GitHub Actions workflows

on:
  push:
    branches: [main, nspr4]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@80429d96b44ae13c8cfe2a2dbec978ffc31c3720 # v3.3.0
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results
