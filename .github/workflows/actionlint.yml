name: Lint GitHub Actions workflows

on:
  push:
    branches: [main, nspr4]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@f9ca3441d43840be4835898c4be6392508ac0bf4 # v3.0.0
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results
