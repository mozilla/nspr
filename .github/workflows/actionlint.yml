name: Lint GitHub Actions workflows

on:
  push:
    branches: [main, nspr4]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results
