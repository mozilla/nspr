name: Lint GitHub Actions workflows

on:
  push:
    branches: [main, nspr4]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@21f6d303fcbd4e418481d01cf738591b847037b7 # v3.2.0
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results
