name: Lint GitHub Actions workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@2152d1412122b04d838d6341aa3b4d6160b3de32 # v2.0.5
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results
