name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.os }}${{ matrix.cc && format(' ({0})', matrix.cc) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            coverage: true
          # Left uninstrumented, so one entry still builds the default optimized config.
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-24.04-arm
            cc: clang
            coverage: true
            gcov: llvm-gcov
          - os: macos-latest
            coverage: true
          - os: macos-15-intel
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # macOS ships LLVM's gcov as gcov, but for clang on Linux the subcommand
      # has to be wrapped: Codecov takes a single gcov executable.
      - name: Install llvm-cov shim
        if: matrix.gcov
        run: |
          sudo apt-get update && sudo apt-get install -y llvm
          llvm_cov=$(command -v llvm-cov || command -v "llvm-cov-$(clang -dumpversion | cut -d. -f1)" || true)
          [ -n "$llvm_cov" ] || { echo "::error::no llvm-cov found"; exit 1; }
          printf '#!/bin/sh\nexec %s gcov "$@"\n' "$llvm_cov" >"$RUNNER_TEMP/llvm-gcov"
          chmod +x "$RUNNER_TEMP/llvm-gcov"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - uses: ./.github/actions/build-and-test
        with:
          cc: ${{ matrix.cc }}
          cflags: ${{ matrix.coverage && '-O0 -g --coverage -fprofile-update=atomic' || '' }}
          cxxflags: ${{ matrix.coverage && '-O0 -g --coverage -fprofile-update=atomic' || '' }}
          ldflags: ${{ matrix.coverage && '--coverage' || '' }}
          configure-args: ${{ matrix.coverage && '--enable-debug' || '' }}
          test-make-args: ${{ matrix.coverage && 'XCFLAGS=--coverage' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          gcov_executable: ${{ matrix.gcov || 'gcov' }}
          flags: ${{ matrix.os }}${{ matrix.cc && format('-{0}', matrix.cc) || '' }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.

  warnings-as-errors:
    name: ubuntu-latest (clang, -Wall -Werror)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-and-test
        with:
          cc: clang
          cflags: "-Wall -Werror -Qunused-arguments"
          tests: "false"

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting (fails if not formatted)
        run: |
          find pr lib -type f \( -name '*.c' -o -name '*.h' \) -print0 |
            xargs -0r clang-format --dry-run

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ruff
        run: pipx install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

  sanitizers:
    name: ubuntu-latest (clang, ASan+UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:halt_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      LSAN_OPTIONS: "suppressions=${{ github.workspace }}/build/sanitizers/lsan_suppressions.txt:print_suppressions=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-and-test
        with:
          cc: clang
          cflags: "-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
          ldflags: "-fsanitize=address,undefined"
          configure-args: --enable-debug

      # CC, CFLAGS, LDFLAGS and MAKEFLAGS are inherited from the build-and-test action.
      - name: Build lib/tests
        run: make -C target/lib/tests

      - name: Run lib/tests
        working-directory: target/lib/tests
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/dist/lib:$LD_LIBRARY_PATH"
          rval=0
          for prog in arena base64t getopt string; do
            printf 'Running %s\n' "$prog"
            if ! ./"$prog"; then
              printf 'FAILED: %s\n' "$prog"
              rval=1
            fi
          done
          exit $rval

  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $url = 'https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe'
          Invoke-WebRequest -Uri $url -OutFile mb.exe
          Start-Process -FilePath .\mb.exe -ArgumentList '/S' -Wait

      - name: Write build script
        shell: bash
        run: |
          cat > build.sh <<'EOF'
          set -e
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/Hostx64/x64:$PATH"
          mkdir target
          cd target
          ../configure --enable-64bit --enable-win32-target=WIN95 --prefix="$PWD/dist"
          make -j"$NUMBER_OF_PROCESSORS"
          make -C pr/tests -j"$NUMBER_OF_PROCESSORS"
          cd pr/tests
          ../../../pr/tests/runtests.sh ../../dist
          EOF

      - name: Build and test
        shell: cmd # zizmor: ignore[misfeature] Needed to "call vcvars64.bat".
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          set MOZILLABUILD=C:\mozilla-build\
          C:\mozilla-build\msys2\msys2_shell.cmd -no-start -defterm -full-path -here -c "bash build.sh"
