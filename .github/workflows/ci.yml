name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unix-build:
    name: NSPR build / ${{ matrix.platform.os }}${{ matrix.platform.cc && format(' ({0}{1})', matrix.platform.cc, matrix.platform.arch == 'ia32' && ', 32-bit' || '') || '' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: &unix-platforms
          - id: ubuntu-latest-gcc
            os: ubuntu-latest
            cc: gcc
            coverage: true
          - id: ubuntu-latest-gcc-x86
            os: ubuntu-latest
            cc: gcc
            arch: ia32
            coverage: true
          # Left uninstrumented, so one entry still builds the default optimized config.
          - id: ubuntu-latest-clang
            os: ubuntu-latest
            cc: clang
          - id: ubuntu-24.04-arm-clang
            os: ubuntu-24.04-arm
            cc: clang
            coverage: true
            gcov: llvm-gcov
          - id: macos-latest
            os: macos-latest
            coverage: true
          - id: macos-15-intel
            os: macos-15-intel
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install platform dependencies
        if: matrix.platform.arch == 'ia32'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - uses: ./.github/actions/build-and-test
        with:
          cc: ${{ matrix.platform.cc }}
          cflags: ${{ matrix.platform.arch == 'ia32' && '-m32' || '' }}
          ldflags: ${{ matrix.platform.arch == 'ia32' && '-m32' || '' }}
          enable-64bit: ${{ matrix.platform.arch != 'ia32' }}
          coverage: ${{ matrix.platform.coverage }}
          run-tests: "false"

      # Archiving preserves executable bits, which Actions artifacts do not.
      - name: Archive build
        run: tar -cf target.tar target

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nspr-${{ matrix.platform.id }}
          path: target.tar
          retention-days: 1

  unix-tests:
    name: ${{ matrix.suite }} tests / ${{ matrix.platform.os }}${{ matrix.platform.cc && format(' ({0}{1})', matrix.platform.cc, matrix.platform.arch == 'ia32' && ', 32-bit' || '') || '' }}
    needs: unix-build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        suite: &test-suites [NSPR, NSS]
        platform: *unix-platforms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nspr-${{ matrix.platform.id }}

      - name: Install platform dependencies
        if: matrix.suite == 'NSPR' && matrix.platform.arch == 'ia32'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Extract NSPR build
        run: tar -xf target.tar

      - name: Run NSPR tests
        if: matrix.suite == 'NSPR'
        working-directory: target/pr/tests
        run: ../../../pr/tests/runtests.sh ../../dist

      - uses: ./.github/actions/build-and-test-nss
        if: matrix.suite == 'NSS'
        with:
          cc: ${{ matrix.platform.cc }}
          target: ${{ matrix.platform.arch }}

      # macOS's gcov already understands clang output. On Linux, Codecov needs
      # a single executable that dispatches to llvm-cov's gcov subcommand.
      - name: Install llvm-cov shim
        if: ${{ !cancelled() && matrix.platform.gcov }}
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          llvm_cov=$(command -v llvm-cov || command -v "llvm-cov-$(clang -dumpversion | cut -d. -f1)" || true)
          [ -n "$llvm_cov" ] || { echo "::error::no llvm-cov found"; exit 1; }
          printf '#!/bin/sh\nexec %s gcov "$@"\n' "$llvm_cov" >"$RUNNER_TEMP/llvm-gcov"
          chmod +x "$RUNNER_TEMP/llvm-gcov"

      - if: ${{ !cancelled() && matrix.platform.coverage }}
        uses: ./.github/actions/upload-coverage
        with:
          gcov: ${{ matrix.platform.gcov && format('{0}/llvm-gcov', runner.temp) || 'gcov' }}
          flags: ${{ matrix.platform.id }}
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.

  warnings-as-errors:
    name: ubuntu-latest (clang, -Wall -Werror)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-and-test
        with:
          cc: clang
          cflags: "-Wall -Werror -Qunused-arguments"
          tests: "false"

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting (fails if not formatted)
        run: |
          find pr lib -type f \( -name '*.c' -o -name '*.h' \) -print0 |
            xargs -0r clang-format --dry-run

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ruff
        run: pipx install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

  sanitizers:
    name: ubuntu-latest (clang, ASan+UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:halt_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      LSAN_OPTIONS: "suppressions=${{ github.workspace }}/build/sanitizers/lsan_suppressions.txt:print_suppressions=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-and-test
        with:
          cc: clang
          cflags: "-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
          ldflags: "-fsanitize=address,undefined"
          configure-args: --enable-debug

      # CC, CFLAGS, LDFLAGS and MAKEFLAGS are inherited from the build-and-test action.
      - name: Build lib/tests
        run: make -C target/lib/tests

      - name: Run lib/tests
        working-directory: target/lib/tests
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/dist/lib:$LD_LIBRARY_PATH"
          rval=0
          for prog in arena base64t getopt string; do
            printf 'Running %s\n' "$prog"
            if ! ./"$prog"; then
              printf 'FAILED: %s\n' "$prog"
              rval=1
            fi
          done
          exit $rval

  windows-build:
    name: NSPR build / windows-latest (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: &windows-architectures [x64, x86]
    env:
      MSYSTEM: MSYS
      CHERE_INVOKING: 1
      MSYS2_PATH_TYPE: inherit
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0} # zizmor: ignore[misfeature] configure needs a POSIX shell.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO: Would like to pin this, but the Mozilla org allowlist requires "ilammy/msvc-dev-cmd@v1*".
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1 # zizmor: ignore[unpinned-uses]
        with:
          arch: ${{ matrix.arch }}

      - name: Install build tools
        run: |
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm make nsinstall

      - name: Configure and build
        env:
          ARCH: ${{ matrix.arch }}
          BITS: ${{ matrix.arch == 'x64' && '--enable-64bit' || '' }}
        run: |
          # MSYS2's coreutils "link" shadows MSVC's linker, which configure uses as LD.
          rm -f /usr/bin/link.exe
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/Hostx64/$ARCH:$PATH"
          export MAKEFLAGS="-j$NUMBER_OF_PROCESSORS"
          srcdir=$PWD
          mkdir target
          cd target
          # Word splitting of $BITS is intended.
          # shellcheck disable=SC2086
          "$srcdir/configure" $BITS --enable-win32-target=WIN95 --prefix="$PWD/dist"
          make
          make -C pr/tests

      # Archiving preserves executable bits and filename case.
      - name: Archive build
        run: tar -cf target.tar target

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nspr-windows-${{ matrix.arch }}
          path: target.tar
          retention-days: 1

  windows-tests:
    name: ${{ matrix.suite }} tests / windows-latest (${{ matrix.arch }})
    needs: windows-build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: *test-suites
        arch: *windows-architectures
    env:
      MSYSTEM: MSYS
      CHERE_INVOKING: 1
      MSYS2_PATH_TYPE: inherit
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0} # zizmor: ignore[misfeature] Tests need a POSIX shell.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nspr-windows-${{ matrix.arch }}

      - name: Extract NSPR build
        run: tar -xf target.tar

      - name: Run NSPR tests
        if: matrix.suite == 'NSPR'
        working-directory: target/pr/tests
        run: ../../../pr/tests/runtests.sh ../../dist

      - uses: ./.github/actions/build-and-test-nss
        if: matrix.suite == 'NSS'
        with:
          target: ${{ matrix.arch == 'x86' && 'ia32' || 'x64' }}

  # MSVC has no gcov, so mingw is the only Windows toolchain here that can
  # produce coverage.
  windows-mingw:
    name: windows-latest (mingw-gcc, coverage)
    runs-on: windows-latest
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0} # zizmor: ignore[misfeature] A login shell is how MSYSTEM selects the ucrt64 toolchain.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-gcc make nsinstall

      - name: Configure, build and test
        env:
          CFLAGS: "-O0 -g --coverage -fprofile-update=atomic"
          LDFLAGS: "--coverage"
        run: |
          srcdir=$PWD
          mkdir target
          cd target
          "$srcdir/configure" --enable-64bit --enable-win32-target=WIN95 --prefix="$PWD/dist"
          make -j"$(nproc)"
          make -C pr/tests -j"$(nproc)" XCFLAGS=--coverage
          cd pr/tests
          "$srcdir/pr/tests/runtests.sh" ../../dist

      - name: Put mingw gcov on PATH for Codecov
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-coverage
        with:
          flags: windows-mingw
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.
