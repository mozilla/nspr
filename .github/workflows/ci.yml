name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.os }}${{ matrix.cc && format(' ({0})', matrix.cc) || '' }}${{ matrix.arch && format(' ({0})', matrix.arch) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            coverage: true
          - os: ubuntu-latest
            cc: gcc
            coverage: true
            arch: x86
            cflags: -m32
            ldflags: -m32
            enable_64bit: "false"
          # Left uninstrumented, so one entry still builds the default optimized config.
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-24.04-arm
            cc: clang
            coverage: true
            gcov: llvm-gcov
          - os: macos-latest
            coverage: true
          - os: macos-15-intel
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install 32-bit toolchain
        if: matrix.arch == 'x86'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # macOS ships LLVM's gcov as gcov, but for clang on Linux the subcommand
      # has to be wrapped: Codecov takes a single gcov executable.
      - name: Install llvm-cov shim
        if: matrix.gcov
        run: |
          sudo apt-get update && sudo apt-get install -y llvm
          llvm_cov=$(command -v llvm-cov || command -v "llvm-cov-$(clang -dumpversion | cut -d. -f1)" || true)
          [ -n "$llvm_cov" ] || { echo "::error::no llvm-cov found"; exit 1; }
          printf '#!/bin/sh\nexec %s gcov "$@"\n' "$llvm_cov" >"$RUNNER_TEMP/llvm-gcov"
          chmod +x "$RUNNER_TEMP/llvm-gcov"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - uses: ./.github/actions/build-and-test
        with:
          cc: ${{ matrix.cc }}
          cflags: ${{ matrix.cflags }}
          ldflags: ${{ matrix.ldflags }}
          enable-64bit: ${{ matrix.enable_64bit || 'true' }}
          coverage: ${{ matrix.coverage }}

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.coverage }}
        uses: ./.github/actions/upload-coverage
        with:
          flags: ${{ matrix.os }}${{ matrix.cc && format('-{0}', matrix.cc) || '' }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          gcov: ${{ matrix.gcov || 'gcov' }}
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.

  warnings-as-errors:
    name: ubuntu-latest (clang, -Wall -Werror)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-and-test
        with:
          cc: clang
          cflags: "-Wall -Werror -Qunused-arguments"
          tests: none

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting (fails if not formatted)
        run: |
          find pr lib -type f \( -name '*.c' -o -name '*.h' \) -print0 |
            xargs -0r clang-format --dry-run

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ruff
        run: pipx install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

  sanitizers:
    name: ubuntu-latest (clang, ASan+UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:halt_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      LSAN_OPTIONS: "suppressions=${{ github.workspace }}/build/sanitizers/lsan_suppressions.txt:print_suppressions=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-and-test
        with:
          cc: clang
          cflags: "-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
          ldflags: "-fsanitize=address,undefined"
          configure-args: --enable-debug

      # CC, CFLAGS, LDFLAGS and MAKEFLAGS are inherited from the build-and-test action.
      - name: Build lib/tests
        run: make -C target/lib/tests

      - name: Run lib/tests
        working-directory: target/lib/tests
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/dist/lib:$LD_LIBRARY_PATH"
          rval=0
          for prog in arena base64t getopt string; do
            printf 'Running %s\n' "$prog"
            if ! ./"$prog"; then
              printf 'FAILED: %s\n' "$prog"
              rval=1
            fi
          done
          exit $rval

  windows:
    name: windows-${{ matrix.arch }} (${{ matrix.cc }}, ${{ matrix.win32_target }})
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    env:
      DLLFLAGS: -PROFILE
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
        cc:
          - cl
          - clang-cl
        win32_target:
          - WIN95
          # - WINNT # Unfixable
        include:
          - arch: arm64
            configure_target: aarch64-pc-mingw32
          - arch: x86
            cc: clang-cl
            win32_target: WIN95
            configure_target: i686-pc-mingw32
            compiler_flags: --target=i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO: Would like to pin this, but the Mozilla org allowlist requires "ilammy/msvc-dev-cmd@v1*".
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1 # zizmor: ignore[unpinned-uses]
        with:
          arch: ${{ matrix.arch }}

      - name: Set up nsinstall
        shell: bash
        run: |
          temp_dir="$(cygpath -u "$RUNNER_TEMP")"
          nsinstall="$temp_dir/nsinstall.py"
          url='https://raw.githubusercontent.com/mozilla-firefox/firefox/6d751cf5d0af4b7fcc1b232b6c2ba0551afabe1d/config/nsinstall.py'
          curl --fail --location --silent --show-error "$url" --output "$nsinstall"
          expected='f88df5591ee50d6e86625efd6e5f9c7b0dd4cba61e27ab533b1990115e100caf'
          actual="$(sha256sum "$nsinstall")"
          actual="${actual%% *}"
          [[ "$actual" == "$expected" ]] || {
            printf 'nsinstall.py hash mismatch: expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          }
          requirements="$temp_dir/nsinstall-requirements.txt"
          cat > "$requirements" <<'EOF'
          mozfile==3.0.0 --hash=sha256:3b0afcda2fa8b802ef657df80a56f21619008f61fcc14b756124028d7b7adf5c
          six==1.17.0 --hash=sha256:4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274
          EOF
          dependencies="$temp_dir/nsinstall-dependencies"
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes --requirement "$requirements" --target "$dependencies"
          bin_dir="$temp_dir/nsinstall-bin"
          mkdir "$bin_dir"
          cat > "$bin_dir/nsinstall" <<'EOF'
          #!/bin/sh
          exec python "$NSINSTALL_PY" "$@"
          EOF
          chmod +x "$bin_dir/nsinstall"
          printf 'NSINSTALL_PY=%s\n' "$(cygpath -m "$nsinstall")" >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s\n' "$(cygpath -m "$dependencies")" >> "$GITHUB_ENV"
          cygpath -m "$bin_dir" >> "$GITHUB_PATH"

      - name: Build NSPR and tests
        uses: ./.github/actions/build-and-test
        with:
          cc: ${{ matrix.cc }}
          cflags: ${{ matrix.compiler_flags }}
          cxxflags: ${{ matrix.compiler_flags }}
          configure-args: ${{ matrix.configure_target && format('--target={0}', matrix.configure_target) || '' }} --enable-win32-target=${{ matrix.win32_target }}
          enable-64bit: ${{ matrix.arch != 'x86' }}
          tests: build

      - name: Verify build and run tests
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          grep -Eq "^CC[[:space:]]*=[[:space:]]*$CC([.]exe)?([[:space:]]|$)" target/config/autoconf.mk
          if [[ "$TARGET_ARCH" == arm64 ]]; then
            grep -Eq '^CPU_ARCH[[:space:]]*=[[:space:]]*aarch64$' target/config/autoconf.mk
          fi
          dumpbin -headers target/dist/lib/*nspr4.dll | grep -Fi "machine ($TARGET_ARCH)"
          cat > target/coverage.config <<'EOF'
          <Configuration>
            <CodeCoverage>
              <ModulePaths>
                <Include>
                  <ModulePath>.*(?:lib)?(?:nspr|plc|plds)4[.]dll$</ModulePath>
                </Include>
              </ModulePaths>
              <EnableDynamicNativeInstrumentation>True</EnableDynamicNativeInstrumentation>
              <EnableStaticNativeInstrumentation>False</EnableStaticNativeInstrumentation>
            </CodeCoverage>
          </Configuration>
          EOF
          coverage_tool="$(cygpath -u "$VSINSTALLDIR")/Common7/IDE/Extensions/Microsoft/CodeCoverage.Console/Microsoft.CodeCoverage.Console.exe"
          coverage_settings="$(cygpath -w "$PWD/target/coverage.config")"
          coverage_output="$(cygpath -w "$PWD/windows-coverage.cobertura.xml")"
          coverage_log="$(cygpath -m "$PWD/coverage-collect.log")"
          cd target/pr/tests
          "$coverage_tool" collect \
            --settings "$coverage_settings" \
            --output "$coverage_output" \
            --output-format cobertura \
            --log-level Verbose \
            --log-file "$coverage_log" \
            "$(cygpath -w "$(command -v bash)")" ../../../pr/tests/runtests.sh ../../dist

      # The arm64 jobs collect nothing ("Profiler was not initialized"), so
      # Codecov rejects their report as REPORT_EMPTY. A native root process does
      # not help, and unlike windows-latest the arm64 image only has VS 2022,
      # whose collector never logs OnInstrumentation. Check what the instrumen-
      # tation engine ships for arm64, and whether static instrumentation works.
      - name: Probe coverage collection
        if: ${{ !cancelled() && matrix.arch == 'arm64' }}
        shell: bash
        run: |
          vs="$(cygpath -u "$VSINSTALLDIR")"
          ls -d "$vs/Common7/IDE/CommonExtensions/Platform/InstrumentationEngine"/*/ || true
          ls -d "$vs/Team Tools/Dynamic Code Coverage Tools"/*/ || true
          coverage_tool="$vs/Common7/IDE/Extensions/Microsoft/CodeCoverage.Console/Microsoft.CodeCoverage.Console.exe"
          cat > target/coverage-static.config <<'EOF'
          <Configuration>
            <CodeCoverage>
              <ModulePaths>
                <Include>
                  <ModulePath>.*(?:nspr|plc|plds)4[.]dll$</ModulePath>
                </Include>
              </ModulePaths>
              <EnableDynamicNativeInstrumentation>False</EnableDynamicNativeInstrumentation>
              <EnableStaticNativeInstrumentation>True</EnableStaticNativeInstrumentation>
            </CodeCoverage>
          </Configuration>
          EOF
          coverage_settings="$(cygpath -w "$PWD/target/coverage-static.config")"
          coverage_log="$(cygpath -m "$PWD/coverage-probe.log")"
          export PATH="$PWD/target/dist/lib:$PATH"
          # Static instrumentation is the C++ path Microsoft documents.
          "$coverage_tool" instrument \
            --settings "$coverage_settings" \
            --log-level Verbose \
            --log-file "$(cygpath -m "$PWD/coverage-instrument.log")" \
            "$(cygpath -w "$PWD/target/dist/lib/nspr4.dll")" || true
          cd target/pr/tests
          "$coverage_tool" collect \
            --settings "$coverage_settings" \
            --output "$(cygpath -w "$PWD/probe.cobertura.xml")" \
            --output-format cobertura \
            --log-level Verbose \
            --log-file "$coverage_log" \
            ./system.exe
          printf 'instrumented lines in probe report: %s\n' "$(grep -c '<line ' probe.cobertura.xml || true)"

      - name: Show coverage collector logs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for log in coverage-collect.log coverage-instrument.log coverage-probe.log; do
            [ -f "$log" ] || continue
            size="$(wc -c <"$log")"
            printf '=== %s (%s bytes) ===\n' "$log" "$size"
            if [ "$size" -le 65536 ]; then
              cat "$log"
            else
              grep -iE 'instrument|profiler|not found|arm64|unsupported|fail' "$log" | sort -u | head -50 || true
            fi
          done

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-coverage
        with:
          file: windows-coverage.cobertura.xml
          flags: windows-${{ matrix.arch }}-${{ matrix.cc }}-${{ matrix.win32_target }}
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.
