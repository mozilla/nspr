name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.os }}${{ matrix.cc && format(' ({0})', matrix.cc) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            coverage: true
          # Left uninstrumented, so one entry still builds the default optimized config.
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-24.04-arm
            cc: clang
            coverage: true
            gcov: llvm-gcov
          - os: macos-latest
            coverage: true
          - os: macos-15-intel
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # macOS ships LLVM's gcov as gcov, but for clang on Linux the subcommand
      # has to be wrapped: Codecov takes a single gcov executable.
      - name: Install llvm-cov shim
        if: matrix.gcov
        run: |
          sudo apt-get update && sudo apt-get install -y llvm
          llvm_cov=$(command -v llvm-cov || command -v "llvm-cov-$(clang -dumpversion | cut -d. -f1)" || true)
          [ -n "$llvm_cov" ] || { echo "::error::no llvm-cov found"; exit 1; }
          printf '#!/bin/sh\nexec %s gcov "$@"\n' "$llvm_cov" >"$RUNNER_TEMP/llvm-gcov"
          chmod +x "$RUNNER_TEMP/llvm-gcov"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - uses: ./.github/actions/build-and-test
        with:
          cc: ${{ matrix.cc }}
          coverage: ${{ matrix.coverage }}

      # Upload even when a test failed; the tests that ran still wrote data.
      - if: ${{ !cancelled() && matrix.coverage }}
        uses: ./.github/actions/upload-coverage
        with:
          gcov: ${{ matrix.gcov || 'gcov' }}
          flags: ${{ matrix.os }}${{ matrix.cc && format('-{0}', matrix.cc) || '' }}
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.

  warnings-as-errors:
    name: ubuntu-latest (clang, -Wall -Werror)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-and-test
        with:
          cc: clang
          cflags: "-Wall -Werror -Qunused-arguments"
          tests: "false"

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting (fails if not formatted)
        run: |
          find pr lib -type f \( -name '*.c' -o -name '*.h' \) -print0 |
            xargs -0r clang-format --dry-run

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ruff
        run: pipx install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

  sanitizers:
    name: ubuntu-latest (clang, ASan+UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:halt_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      LSAN_OPTIONS: "suppressions=${{ github.workspace }}/build/sanitizers/lsan_suppressions.txt:print_suppressions=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-and-test
        with:
          cc: clang
          cflags: "-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
          ldflags: "-fsanitize=address,undefined"
          configure-args: --enable-debug

      # CC, CFLAGS, LDFLAGS and MAKEFLAGS are inherited from the build-and-test action.
      - name: Build lib/tests
        run: make -C target/lib/tests

      - name: Run lib/tests
        working-directory: target/lib/tests
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/dist/lib:$LD_LIBRARY_PATH"
          rval=0
          for prog in arena base64t getopt string; do
            printf 'Running %s\n' "$prog"
            if ! ./"$prog"; then
              printf 'FAILED: %s\n' "$prog"
              rval=1
            fi
          done
          exit $rval

  linux-x86:
    name: ubuntu-latest (gcc, 32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - uses: ./.github/actions/build-and-test
        with:
          cc: gcc
          cflags: -m32
          ldflags: -m32
          enable-64bit: "false"
          coverage: "true"

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-coverage
        with:
          flags: ubuntu-latest-gcc-x86
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.

  windows:
    name: windows-latest (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            bits: --enable-64bit
          - arch: x86
            bits: ""
    env:
      MSYSTEM: MSYS
      CHERE_INVOKING: 1
      MSYS2_PATH_TYPE: inherit
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0} # zizmor: ignore[misfeature] configure needs a POSIX shell.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO: Would like to pin this, but the Mozilla org allowlist requires "ilammy/msvc-dev-cmd@v1*".
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1 # zizmor: ignore[unpinned-uses]
        with:
          arch: ${{ matrix.arch }}

      - name: Install build tools
        run: |
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm make nsinstall

      - name: Configure, build and test
        env:
          ARCH: ${{ matrix.arch }}
          BITS: ${{ matrix.bits }}
        run: |
          # MSYS2's coreutils "link" shadows MSVC's linker, which configure uses as LD.
          rm -f /usr/bin/link.exe
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/Hostx64/$ARCH:$PATH"
          export MAKEFLAGS="-j$NUMBER_OF_PROCESSORS"
          srcdir=$PWD
          mkdir target
          cd target
          # Word splitting of $BITS is intended.
          # shellcheck disable=SC2086
          "$srcdir/configure" $BITS --enable-win32-target=WIN95 --prefix="$PWD/dist"
          make
          make -C pr/tests
          cd pr/tests
          "$srcdir/pr/tests/runtests.sh" ../../dist

  # MSVC has no gcov, so mingw is the only Windows toolchain here that can
  # produce coverage.
  windows-mingw:
    name: windows-latest (mingw-gcc, coverage)
    runs-on: windows-latest
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0} # zizmor: ignore[misfeature] A login shell is how MSYSTEM selects the ucrt64 toolchain.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-gcc make nsinstall

      - name: Configure, build and test
        env:
          CFLAGS: "-O0 -g --coverage -fprofile-update=atomic"
          LDFLAGS: "--coverage"
        run: |
          srcdir=$PWD
          mkdir target
          cd target
          "$srcdir/configure" --enable-64bit --enable-win32-target=WIN95 --prefix="$PWD/dist"
          make -j"$(nproc)"
          make -C pr/tests -j"$(nproc)" XCFLAGS=--coverage
          cd pr/tests
          "$srcdir/pr/tests/runtests.sh" ../../dist

      - name: Put mingw gcov on PATH for Codecov
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-coverage
        with:
          flags: windows-mingw
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.
