name: Build and test NSPR
description: Configure and build NSPR out of tree, and optionally build and run pr/tests.

inputs:
  cc:
    description: Compiler to use; empty lets configure pick one.
    default: ""
  cflags:
    description: CFLAGS for the build.
    default: ""
  cxxflags:
    description: CXXFLAGS for the build.
    default: ""
  ldflags:
    description: LDFLAGS for the build.
    default: ""
  configure-args:
    description: Extra configure arguments; --prefix is always passed.
    default: ""
  enable-64bit:
    description: Whether to pass --enable-64bit.
    default: "true"
  coverage:
    description: Whether to instrument the build for coverage.
    default: "false"
  tests:
    description: Test mode; one of none, build, or run.
    default: run

runs:
  using: composite
  steps:
    # Exported so the caller's own build steps, such as lib/tests, inherit them too.
    - name: Set build environment
      shell: bash
      env:
        CC: ${{ inputs.cc }}
        CFLAGS: ${{ inputs.cflags }}
        CXXFLAGS: ${{ inputs.cxxflags }}
        LDFLAGS: ${{ inputs.ldflags }}
        COVERAGE: ${{ inputs.coverage }}
        TESTS: ${{ inputs.tests }}
      run: |
        case "$TESTS" in
          none | build | run) ;;
          *)
            echo "::error::tests must be one of: none, build, run"
            exit 1
            ;;
        esac
        if [ "$COVERAGE" = true ]; then
          cov="-O0 -g --coverage -fprofile-update=atomic"
          CFLAGS="$cov${CFLAGS:+ $CFLAGS}"
          CXXFLAGS="$cov${CXXFLAGS:+ $CXXFLAGS}"
          LDFLAGS="--coverage${LDFLAGS:+ $LDFLAGS}"
        fi
        jobs=${NUMBER_OF_PROCESSORS:-$(getconf _NPROCESSORS_ONLN)}
        if [ "$RUNNER_OS" = Windows ]; then
          rm -f /usr/bin/link.exe
          cygpath -m "$PWD/target/dist/lib" >> "$GITHUB_PATH"
        fi
        {
          echo "MAKEFLAGS=-j$jobs"
          echo "CC=$CC"
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "LDFLAGS=$LDFLAGS"
        } >> "$GITHUB_ENV"

    - name: Configure and build
      shell: bash
      env:
        CONFIGURE_ARGS: ${{ inputs.configure-args }}
        ENABLE_64BIT: ${{ inputs.enable-64bit }}
        COVERAGE: ${{ inputs.coverage }}
      run: |
        # Keep source paths absolute for gcov, except where Windows make requires a relative path.
        srcdir=$PWD
        if [ "$RUNNER_OS" = Windows ]; then
          srcdir=..
        fi
        configure_args=()
        if [ "$ENABLE_64BIT" = true ]; then
          configure_args+=(--enable-64bit)
        fi
        if [ "$COVERAGE" = true ]; then
          configure_args+=(--enable-debug)
        fi
        if [ -n "$CONFIGURE_ARGS" ]; then
          read -r -a extra_args <<< "$CONFIGURE_ARGS"
          configure_args+=("${extra_args[@]}")
        fi
        mkdir target
        cd target
        "$srcdir/configure" "${configure_args[@]}" --prefix="$PWD/dist"
        make

    - name: Build tests
      if: inputs.tests != 'none'
      shell: bash
      env:
        COVERAGE: ${{ inputs.coverage }}
      run: |
        make_args=()
        if [ "$COVERAGE" = true ]; then
          make_args+=(XCFLAGS=--coverage)
        fi
        make -C target/pr/tests "${make_args[@]}"

    - name: Run tests
      if: inputs.tests == 'run'
      shell: bash
      working-directory: target/pr/tests
      run: ../../../pr/tests/runtests.sh ../../dist
