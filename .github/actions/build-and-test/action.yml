name: Build and test NSPR
description: Configure and build NSPR out of tree, and optionally build and run pr/tests.

inputs:
  cc:
    description: Compiler to use; empty lets configure pick one.
    default: ""
  cflags:
    description: CFLAGS for the build.
    default: ""
  cxxflags:
    description: CXXFLAGS for the build.
    default: ""
  ldflags:
    description: LDFLAGS for the build.
    default: ""
  configure-args:
    description: Extra configure arguments; --enable-64bit and --prefix are always passed.
    default: ""
  tests:
    description: Whether to build and run pr/tests.
    default: "true"
  test-make-args:
    description: Extra arguments for the pr/tests make.
    default: ""

runs:
  using: composite
  steps:
    # Exported so the caller's own build steps, such as lib/tests, inherit them too.
    - name: Set build environment
      shell: bash
      env:
        CC: ${{ inputs.cc }}
        CFLAGS: ${{ inputs.cflags }}
        CXXFLAGS: ${{ inputs.cxxflags }}
        LDFLAGS: ${{ inputs.ldflags }}
      run: |
        {
          echo "MAKEFLAGS=-j$(getconf _NPROCESSORS_ONLN)"
          echo "CC=$CC"
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "LDFLAGS=$LDFLAGS"
        } >> "$GITHUB_ENV"

    - name: Configure and build
      shell: bash
      env:
        CONFIGURE_ARGS: ${{ inputs.configure-args }}
      run: |
        mkdir target
        cd target
        # Word splitting of $CONFIGURE_ARGS is intended.
        # shellcheck disable=SC2086
        ../configure --enable-64bit $CONFIGURE_ARGS --prefix="$PWD/dist"
        make

    - name: Build tests
      if: inputs.tests == 'true'
      shell: bash
      env:
        TEST_MAKE_ARGS: ${{ inputs.test-make-args }}
      run: |
        # Word splitting of $TEST_MAKE_ARGS is intended.
        # shellcheck disable=SC2086
        make -C target/pr/tests $TEST_MAKE_ARGS

    - name: Run tests
      if: inputs.tests == 'true'
      shell: bash
      working-directory: target/pr/tests
      run: ../../../pr/tests/runtests.sh ../../dist
