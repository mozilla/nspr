name: Upload coverage
description: Upload a coverage report to Codecov under a per-platform flag.

inputs:
  flags:
    description: Codecov flag identifying the platform.
    required: true
  token:
    description: Codecov token.
    required: true
  gcov:
    description: Reader for gcov data; one of gcov or llvm-cov. Empty means gcov.
    default: gcov
  file:
    description: Coverage report file; empty looks for gcda files.
    default: ""

runs:
  using: composite
  steps:
    # Codecov takes a single gcov executable, but LLVM's is a subcommand, so it
    # needs wrapping. macOS ships LLVM's gcov as gcov and needs neither.
    - name: Set up gcov reader
      id: reader
      if: inputs.gcov == 'llvm-cov'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          sudo apt-get update && sudo apt-get install -y llvm
        fi
        llvm_cov=$(command -v llvm-cov ||
          command -v "llvm-cov-$(clang -dumpversion | cut -d. -f1)" || true)
        [ -n "$llvm_cov" ] || { echo "::error::no llvm-cov found"; exit 1; }
        shim="$RUNNER_TEMP/llvm-gcov"
        printf '#!/bin/sh\nexec %s gcov "$@"\n' "$llvm_cov" >"$shim"
        chmod +x "$shim"
        echo "shim=$shim" >>"$GITHUB_OUTPUT"

    # Callers upload even when a test failed, so a build that never produced
    # data would otherwise trip fail_ci_if_error with a confusing error.
    - name: Look for coverage data
      id: check
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        FLAGS: ${{ inputs.flags }}
      run: |
        if { [ -n "$FILE" ] && [ -f "$FILE" ]; } ||
          { [ -z "$FILE" ] && [ -n "$(find . -name '*.gcda' -print -quit)" ]; }; then
          echo "found=true" >>"$GITHUB_OUTPUT"
        else
          echo "::warning::No coverage data for $FLAGS; skipping upload"
        fi

    - name: Upload coverage
      if: steps.check.outputs.found == 'true'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        disable_search: ${{ inputs.file != '' }}
        files: ${{ inputs.file }}
        gcov_executable: ${{ steps.reader.outputs.shim || 'gcov' }}
        flags: ${{ inputs.flags }}
        fail_ci_if_error: true
        token: ${{ inputs.token }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.
