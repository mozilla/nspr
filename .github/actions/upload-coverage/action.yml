name: Upload coverage
description: Upload a coverage report to Codecov under a per-platform flag.

inputs:
  flags:
    description: Codecov flag identifying the platform.
    required: true
  token:
    description: Codecov token.
    required: true
  gcov:
    description: gcov executable, where the default one cannot read the data.
    default: gcov
  plugins:
    description: Codecov CLI plugins; "noop" where gcov has already been run.
    default: ""
  file:
    description: Coverage report to upload instead of searching for gcov data.
    default: ""

runs:
  using: composite
  steps:
    # Callers upload even when a test failed, so a build that never produced
    # data would otherwise trip fail_ci_if_error with a confusing error.
    - name: Look for coverage data
      id: check
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        FLAGS: ${{ inputs.flags }}
      run: |
        # .gcda where Codecov runs gcov itself, .gcov where a VM already did.
        found=
        if [ -n "$FILE" ]; then
          if [ -f "$FILE" ]; then found=$FILE; fi
        else
          found=$(find . \( -name '*.gcda' -o -name '*.gcov' \) -print -quit)
        fi
        if [ -n "$found" ]; then
          echo "found=true" >>"$GITHUB_OUTPUT"
        else
          echo "::warning::No coverage data for $FLAGS; skipping upload"
        fi

    - if: steps.check.outputs.found == 'true'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        gcov_executable: ${{ inputs.gcov }}
        plugins: ${{ inputs.plugins }}
        files: ${{ inputs.file }}
        disable_search: ${{ inputs.file != '' }}
        flags: ${{ inputs.flags }}
        fail_ci_if_error: true
        token: ${{ inputs.token }} # zizmor: ignore[secrets-outside-env] A dedicated environment buys nothing for an upload-only token.
