# https://docs.codecov.com/docs/codecov-yaml
ignore:
  - "pr/tests"
  - "lib/tests"

fixes:
  - "C:/a/nspr/nspr/::"
  - "D:/a/nspr/nspr/::"
  - "**/pr/::pr/"
  - "**/lib/::lib/"
  - "**/config/::config/"

# Coverage is uploaded per platform, so one failed job must not look like a drop.
flag_management:
  default_rules:
    carryforward: true
